<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar | Restocka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- TOPO -->
  <header class="topbar">
    <div class="logo">
      <a href="index.html">Restocka</a>
    </div>

    <nav>
      <a href="index.html" class="nav-btn">Início</a>
      <a href="marketplace.html" class="nav-btn">Marketplace</a>
      <a href="login.html" class="btn-outline">Entrar</a>
    </nav>
  </header>

  <!-- LOGIN -->
  <main class="login-container">
    <section class="login-box">
      <h1>Entrar</h1>
      <p>Acesse sua conta para continuar.</p>

      <form>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <p class="login-footer">
        Ainda não tem conta?
        <a href="fornecedor.html">Cadastre-se como fornecedor</a>
      </p>
    </section>
  </main>

</body>
</html>
