<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar | Restocka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- TOPO -->
  <header class="topbar">
    <div class="logo">
      <a href="index.html">Restocka</a>
    </div>

    <nav>
      <a href="index.html" class="nav-btn">Início</a>
      <a href="marketplace.html" class="nav-btn">Marketplace</a>
      <a href="login.html" class="btn-outline">Entrar</a>
    </nav>
  </header>

  <!-- LOGIN -->
  <main class="login-container">
    <section class="login-box">
      <h1>Entrar</h1>
      <p>Acesse sua conta para continuar.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <p class="login-footer">
        Ainda não tem conta?
        <a href="fornecedor.html">Cadastre-se</a>
      </p>
     
    <p class="login-footer">
      admin@demo.com - 123456 <br>
      cliente@demo.com - 123456 <br>
      fornecedor@demo.com - 123456 <br>
    </p>

    </section>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
    
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
    
      try {
        const response = await fetch('http://localhost:3000/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, senha })
        });
    
        const data = await response.json();
    
        if (!response.ok) {
          alert(data.erro || 'Erro no login');
          return;
        }

        alert ('Login realizado com sucesso!');
      } catch (error){
        console.error('Erro na requisição:', error);
        alert('Falha ao conectar como o servidor');
      }
    
        // LOGIN OK
        // SALVA O USUÁRIO AQUI
        localStorage.setItem('usuario', JSON.stringify(data.usuario.role));
    
        // REDIRECIONAMENTO POR TIPO
        console.log(data.usuario);
        if (data.usuario.role === 'admin') {
          window.location.href = 'admin.html';
        } else if (data.usuario.role === 'supplier') {
          window.location.href = 'fornecedor.html';
        } else {
          window.location.href = 'cliente.html';
        }
    
      });
    </script>
</body>
</html>
