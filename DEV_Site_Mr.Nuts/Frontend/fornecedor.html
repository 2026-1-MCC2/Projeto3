<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Fornecedor</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/fornecedor.css">
</head>
<body>

<script>
const usuario = JSON.parse(localStorage.getItem('usuario'));

if (!usuario || usuario.role !== 'supplier') {
  alert('Acesso negado');
  window.location.href = 'login.html';
}
</script>

<header class="topbar">
  <div class="logo">
    <strong>Área do Fornecedor</strong>
  </div>

  <nav class="menu">
    <a href="#">Meus Produtos</a>
    <a href="#">Cadastrar Produto</a>
  </nav>

  <div class="user-actions">
    <button onclick="irConfig()">Configurações</button>
    <button onclick="logout()">Sair</button>
  </div>
</header>

<main>
  <h1>Painel do Fornecedor</h1>

  <div class="card">
    <h3>Cadastrar Produto</h3>
    <p>Adicione novos produtos ao marketplace.</p>
  </div>

  <div class="card">
    <h3>Meus Anúncios</h3>
    <p>Gerencie seus produtos cadastrados.</p>
  </div>
</main>

<script>

function irConfig() {
  window.location.href = 'fornecedor-config.html';
}

function logout() {
  localStorage.removeItem('usuario');
  window.location.href = 'login.html';
}

</script>

</body>
</html>
