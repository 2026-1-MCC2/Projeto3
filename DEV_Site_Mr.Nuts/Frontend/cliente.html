<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Marketplace | Cliente</title>
  
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cliente.css">
  </head>
  
<body>

<!-- PROTEÇÃO -->
<script>
const usuario = JSON.parse(localStorage.getItem('usuario'));

if (!usuario || usuario.role !== 'buyer') {
  alert('Acesso negado');
  window.location.href = 'login.html';
}
</script>

<header class="topbar">
  <div class="logo">
    <strong>Restocka</strong>
  </div>

  <nav class="menu">
    #Marketplace</a>
    #Pedidos</a>
    #Favoritos</a>
  </nav>

  <div class="user-actions">
    <button onclick="irConfig()">Configurações</button>
    <button onclick="logout()">Sair</button>
  </div>
</header>

<main>

  <h1>Produtos disponíveis</h1>

  <div id="produtos" class="produtos-grid">
    <!-- produtos vão aparecer aqui -->
  </div>

</main>

<script>

// LOGOUT
function logout() {
  localStorage.removeItem('usuario');
  window.location.href = 'login.html';
}

// IR PARA CONFIGURAÇÕES
function irConfig() {
  window.location.href = 'cliente-config.html';
}

// BUSCAR PRODUTOS DO BACKEND
async function carregarProdutos() {
  try {
    const response = await fetch('http://localhost:3000/anuncios');
    const produtos = await response.json();

    const container = document.getElementById('produtos');
    container.innerHTML = '';

    produtos.forEach(produto => {
      container.innerHTML += `
        <div class="card-produto">
          <h3>${produto.nome}</h3>
          <p>${produto.descricao}</p>
          <p><strong>Marca:</strong> ${produto.marca || '-'}</p>
          <p><strong>MOQ:</strong> ${produto.moq}</p>
          <button onclick="verProduto(${produto.id})">Ver detalhes</button>
        </div>
      `;
    });

  } catch (error) {
    console.error('Erro ao carregar produtos:', error);
  }
}

// VER DETALHES
function verProduto(id) {
  alert('Abrir produto ID: ' + id);
}

// CARREGAR AUTOMATICAMENTE
carregarProdutos();

</script>

</body>
</html>
