<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Marketplace | Restocka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>

<body>

<!-- PROTEÇÃO -->
<script>
const usuario = JSON.parse(localStorage.getItem('usuario'));

if (!usuario || usuario.role !== 'buyer') {
  alert('Acesso negado');
  window.location.href = 'login.html';
}
</script>

<!-- TOPO -->
<header class="topbar">
  <div class="logo">
    <a href="cliente.html">Restocka</a>
  </div>

  <nav>
    <a href="cliente.html" class="nav-btn">Marketplace</a>
    <a href="favoritos.html" class="nav-btn">Favoritos</a>

    <button onclick="irConfig()" class="nav-btn">Configurações</button>
    <button onclick="logout()" class="btn-outline">Sair</button>
  </nav>
</header>

<!-- MARKETPLACE -->
<main class="marketplace-container">

  <section class="marketplace-header">
    <h1>Marketplace</h1>
    <p>Bem-vindo, <strong id="nomeUsuario"></strong></p>
  </section>

  <section id="produtos" class="products-grid">
    <!-- produtos carregam aqui -->
  </section>

</main>

<footer>
  <p>© 2026 Restocka • Todos os direitos reservados</p>
</footer>

<script>

// mostrar nome
document.getElementById('nomeUsuario').innerText = usuario.nome;


// logout
function logout() {
  localStorage.removeItem('usuario');
  window.location.href = 'login.html';
}


// ir config
function irConfig() {
  window.location.href = 'cliente-config.html';
}


// adicionar favorito
function adicionarFavorito(id) {
  const produto = produtos.find(p => p.id === id);

  if (!produto) return;

  let favoritos = JSON.parse(localStorage.getItem('favoritos')) || [];

  const existe = favoritos.find(p => p.id === id);

  if (existe) {
    alert('Produto já está nos favoritos');
    return;
  }

  favoritos.push(produto);
  localStorage.setItem('favoritos', JSON.stringify(favoritos));

  alert('Produto adicionado aos favoritos');
}


// botão orçamento
function solicitar(id) {
  alert('Solicitar orçamento do produto ID: ' + id);
}


let produtos = []; // GLOBAL

// carregar produtos
async function carregarProdutos() {
  try {
    const response = await fetch('http://localhost:3000/anuncios');
    produtos = await response.json(); 
    const container = document.getElementById('produtos');
    container.innerHTML = '';

    if (produtos.length === 0) {
      container.innerHTML = '<p>Nenhum produto disponível.</p>';
      return;
    }

    produtos.forEach(produto => {
      container.innerHTML += `
        <article class="product-card">
          <div class="product-image"></div>

          <h3>${produto.nome}</h3>

          <p>Fornecedor: ${produto.fornecedor_nome || 'Não informado'}</p>

          <strong>${produto.preco ? 'R$ ' + produto.preco : ''}</strong>

          <button onclick="adicionarFavorito(${produto.id})">
            Favoritar
          </button>

          <a href="#" class="btn-primary" onclick="solicitar(${produto.id})">
            Solicitar orçamento
          </a>
        </article>
      `;
    });

  } catch (error) {
    console.error('Erro ao carregar produtos:', error);
  }
}


//  FAVORITO
function adicionarFavorito(id) {
  const produto = produtos.find(p => p.id === id);

  if (!produto) return;

  let favoritos = JSON.parse(localStorage.getItem('favoritos')) || [];

  const existe = favoritos.find(p => p.id === id);

  if (existe) {
    alert('Produto já está nos favoritos');
    return;
  }

  favoritos.push(produto);
  localStorage.setItem('favoritos', JSON.stringify(favoritos));

  alert('Produto adicionado aos favoritos');
}


// botão orçamento
function solicitar(id) {
  alert('Solicitar orçamento do produto ID: ' + id);
}


// iniciar
carregarProdutos();
</script>

</body>
</html>
